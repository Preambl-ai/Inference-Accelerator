name: RTL Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # every sweep target must be in sweep-all, and the Makefile must end
      # with a newline: either mistake once skipped a sweep silently
      - name: Flow guard
        run: python3 ci/check_flow.py Makefile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V | head -1

      - name: Install cocotb
        run: pip install cocotb==2.0.1 numpy

      - name: Run DEPTH sweep
        run: make sweep

      - name: pe sweep
        run: make sweep-pe

      - name: Golden model self-tests
        run: |
          PYTHONPATH=systolic_array/model python systolic_array/model/delay_model.py
          PYTHONPATH=systolic_array/model python systolic_array/model/pe_model.py
          PYTHONPATH=systolic_array/model python systolic_array/model/systolic_array_model.py
          PYTHONPATH=systolic_array/model python systolic_array/model/ctrl_fsm_model.py
          PYTHONPATH=systolic_array/model python systolic_array/model/requant_model.py
          python memory/model/bram_model.py
          python axis/model/skid_buffer_model.py
          PYTHONPATH=systolic_array/model python gemm_tile/model/gemm_tile_model.py
          PYTHONPATH=memory/model python im2col/model/im2col_model.py
          PYTHONPATH=memory/model python memory/model/act_buffer_model.py
          PYTHONPATH=systolic_array/model python conv_layer/model/conv_layer_model.py
          python host/protocol.py
          python uart/model/uart_model.py
          PYTHONPATH=host python csr/model/csr_model.py
          python ci/check_flow.py Makefile
          PYTHONPATH=conv_layer/model:systolic_array/model python pool/model/pool_model.py
          PYTHONPATH=conv_layer/model:systolic_array/model:pool/model python layer_engine/model/layer_engine_model.py
          PYTHONPATH=conv_layer/model:systolic_array/model python add/model/add_model.py

      - name: systolic array sweep
        run: make sweep-array

      - name: ctrl_fsm sweep
        run: make sweep-ctrl

      - name: requant sweep
        run: make sweep-requant

      - name: bram sweep
        run: make sweep-bram

      - name: skid_buffer sweep
        run: make sweep-skid

      - name: gemm_tile sweep
        run: make sweep-gemm

      - name: im2col_reader sweep
        run: make sweep-im2col

      - name: act_buffer sweep
        run: make sweep-act

      - name: conv_layer sweep
        run: make sweep-conv

      - name: uart sweep
        run: make sweep-uart

      - name: csr sweep
        run: make sweep-csr

      - name: top end-to-end sweep (UART pins, fast bit period)
        run: make sweep-top

      - name: pool sweep
        run: make sweep-pool

      - name: layer_engine sweep
        run: make sweep-engine

      - name: add sweep
        run: make sweep-add

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-results
          path: '**/results.xml'
          