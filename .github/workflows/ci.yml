name: RTL Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V | head -1

      - name: Install cocotb
        run: pip install cocotb==2.0.1 numpy

      - name: Run DEPTH sweep
        run: make sweep

      - name: pe sweep
        run: make sweep-pe

      - name: Golden model self-tests
        run: |
          PYTHONPATH=systolic_array/model python systolic_array/model/delay_model.py
          PYTHONPATH=systolic_array/model python systolic_array/model/pe_model.py
          PYTHONPATH=systolic_array/model python systolic_array/model/systolic_array_model.py
          PYTHONPATH=systolic_array/model python systolic_array/model/ctrl_fsm_model.py
          PYTHONPATH=systolic_array/model python systolic_array/model/requant_model.py
          python memory/model/bram_model.py
          python axis/model/skid_buffer_model.py
          PYTHONPATH=systolic_array/model python gemm_tile/model/gemm_tile_model.py

      - name: systolic array sweep
        run: make sweep-array

      - name: ctrl_fsm sweep
        run: make sweep-ctrl

      - name: requant sweep
        run: make sweep-requant

      - name: bram sweep
        run: make sweep-bram

      - name: skid_buffer sweep
        run: make sweep-skid

      - name: gemm_tile sweep
        run: make sweep-gemm

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-results
          path: '**/results.xml'
          